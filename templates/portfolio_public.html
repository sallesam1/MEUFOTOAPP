<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Antes e Depois - MeuFotoApp</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Segoe UI',Arial,sans-serif; background:#f0f2f5; color:#333; min-height:100vh; }
.header { background:linear-gradient(135deg,#1a1a2e,#16213e); color:#fff; padding:28px 20px; text-align:center; }
.header h1 { font-size:22px; font-weight:700; margin-bottom:4px; }
.header p { font-size:13px; opacity:0.8; }
.container { max-width:900px; margin:0 auto; padding:20px; }
.compare-card { background:#fff; border-radius:12px; overflow:hidden; box-shadow:0 4px 16px rgba(0,0,0,0.1); margin-bottom:20px; }
.compare-title { padding:16px 20px; font-size:16px; font-weight:700; color:#333; border-bottom:1px solid #eee; }
.compare-grid { display:grid; grid-template-columns:1fr 1fr; gap:0; }
.compare-side { position:relative; overflow:hidden; }
.compare-side .label { position:absolute; top:10px; left:10px; background:rgba(0,0,0,0.7); color:#fff; font-size:12px; padding:4px 12px; border-radius:4px; font-weight:600; z-index:2; }
.compare-side img { width:100%; height:400px; object-fit:cover; display:block; cursor:pointer; }
.compare-side-placeholder { width:100%; height:400px; display:flex; align-items:center; justify-content:center; background:#f5f5f5; color:#ccc; font-size:48px; }
.footer { text-align:center; padding:24px 20px; color:#999; font-size:12px; }
.lightbox { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.92); z-index:9999; justify-content:center; align-items:center; }
.lightbox.show { display:flex; }
.lightbox img { max-width:90%; max-height:85%; object-fit:contain; border-radius:6px; }
.lightbox-close { position:absolute; top:15px; right:20px; color:#fff; font-size:36px; cursor:pointer; z-index:10000; line-height:1; }
@media (max-width:600px) {
    .compare-grid { grid-template-columns:1fr; }
    .compare-side img { height:300px; }
}
</style>
</head>
<body>
<div class="header">
<h1>Antes e Depois</h1>
<p>Veja a transformacao</p>
</div>
<div class="container">
<div class="compare-card">
{% if item.title %}
<div class="compare-title">{{ item.title }}</div>
{% endif %}
<div class="compare-grid">
<div class="compare-side">
<div class="label">ANTES</div>
{% if item.before_path %}
<img src="{{ url_for('serve_wm', filename=item.before_path) }}" onclick="openLightbox(this.src)">
{% else %}
<div class="compare-side-placeholder">&#128247;</div>
{% endif %}
</div>
<div class="compare-side">
<div class="label">DEPOIS</div>
{% if item.after_path %}
<img src="{{ url_for('serve_wm', filename=item.after_path) }}" onclick="openLightbox(this.src)">
{% else %}
<div class="compare-side-placeholder">&#128247;</div>
{% endif %}
</div>
</div>
</div>
</div>
<div class="footer">
<p>MeuFotoApp - Portfolio</p>
</div>
<div class="lightbox" id="lightbox" onclick="closeLightbox()">
<span class="lightbox-close" onclick="closeLightbox()">&times;</span>
<img id="lbImg" src="">
</div>
<script>
function openLightbox(src) {
    document.getElementById('lbImg').src = src;
    document.getElementById('lightbox').classList.add('show');
}
function closeLightbox() {
    document.getElementById('lightbox').classList.remove('show');
}
document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') closeLightbox();
});
</script>

<script src="/static/js/mobile-fix.js"></script>
</body>
</html>
